<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1060" height="204" viewBox="0 0 1060 204"><title>Code: making ideas useful. AI: exploring new ways to build. Open source: sharing tools and learning.</title><style>@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes signal{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}.intro{animation:arrive .7s ease-out both}.signal{stroke-dasharray:6 154;animation:signal 5s linear 2}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1059" height="203" rx="14" fill="#F6F8FC" stroke="#D8DFEB"/><text x="28" y="43" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="28" fill="#185AE8" font-weight="600" letter-spacing="-.7">Code</text><text x="28" y="75" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#182237" font-weight="600">Making ideas useful.</text><text x="28" y="101" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#53647B" >Practical tools, thoughtful interfaces,</text><text x="28" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#53647B" >and fewer repetitive tasks.</text><path d="M360 24V180" stroke="#D8DFEB"/><text x="378" y="43" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="28" fill="#185AE8" font-weight="600" letter-spacing="-.7">AI</text><text x="378" y="75" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#182237" font-weight="600">Curiosity, with a feedback loop.</text><text x="378" y="101" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#53647B" >Exploring agents, intelligent systems,</text><text x="378" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#53647B" >and new ways to build software.</text><path d="M710 24V180" stroke="#D8DFEB"/><text x="728" y="43" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="28" fill="#185AE8" font-weight="600" letter-spacing="-.7">Open source</text><text x="728" y="75" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#182237" font-weight="600">Good ideas travel further.</text><text x="728" y="101" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#53647B" >Sharing what I learn and building</text><text x="728" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#53647B" >tools other people can use.</text></svg>