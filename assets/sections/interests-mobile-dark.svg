<svg xmlns="http://www.w3.org/2000/svg" role="img" width="390" height="406" viewBox="0 0 390 406"><title>Code: making ideas useful. AI: exploring new ways to build. Open source: sharing tools and learning.</title><style>@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes signal{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}.intro{animation:arrive .7s ease-out both}.signal{stroke-dasharray:6 154;animation:signal 5s linear 2}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="389" height="405" rx="14" fill="#161B22" stroke="#30363D"/><text x="24" y="43" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#6495FF" font-weight="600" letter-spacing="-.7">Code</text><text x="24" y="75" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#F0F3FA" font-weight="600">Making ideas useful.</text><text x="24" y="101" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9DAABD" >Practical tools, thoughtful interfaces,</text><text x="24" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9DAABD" >and fewer repetitive tasks.</text><path d="M24 137L366 137" stroke="#30363D"/><text x="24" y="173" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#6495FF" font-weight="600" letter-spacing="-.7">AI</text><text x="24" y="205" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#F0F3FA" font-weight="600">Curiosity, with a feedback loop.</text><text x="24" y="231" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9DAABD" >Exploring agents, intelligent systems,</text><text x="24" y="251" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9DAABD" >and new ways to build software.</text><path d="M24 267L366 267" stroke="#30363D"/><text x="24" y="303" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#6495FF" font-weight="600" letter-spacing="-.7">Open source</text><text x="24" y="335" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#F0F3FA" font-weight="600">Good ideas travel further.</text><text x="24" y="361" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9DAABD" >Sharing what I learn and building</text><text x="24" y="381" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9DAABD" >tools other people can use.</text></svg>