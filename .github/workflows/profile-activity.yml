name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    paths:
      - 'README.md'
      - '.github/workflows/profile-activity.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/brands/**'
      - 'assets/chips/**'
      - 'assets/headers/**'
      - 'assets/icons/**'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run streak unit tests
        run: node --test tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check scripts/update-contributions.mjs
          node --check scripts/build-v5.mjs
      - name: Generate compact editorial panels
        run: node scripts/build-v5.mjs
      - name: Build verified contribution SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: melloxyz
        run: node scripts/update-contributions.mjs
      - name: Validate README references and SVG XML
        run: |
          node scripts/check-profile.mjs
          python3 scripts/validate-svg.py
      - name: Commit updated activity graphics
        run: |
          git add assets/activity/ assets/headers/ assets/sections/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): regenerate profile visuals"
            git push
          fi
