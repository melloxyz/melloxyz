name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    paths:
      - '.github/workflows/profile-activity.yml'
      - 'scripts/update-contributions.mjs'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build contribution SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: melloxyz
        run: node scripts/update-contributions.mjs
      - name: Commit updated graphics
        run: |
          git add assets/activity/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): refresh contribution visuals"
            git push
